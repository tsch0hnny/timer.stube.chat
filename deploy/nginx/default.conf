# Static site config shared by the device spike and the gig build (nuxt generate output).
# Rules:
#  - HTML, the service worker, the manifest and anything else unhashed: "no-cache" (always revalidate,
#    ETag gives cheap 304s). The SW file additionally gets no-store so no proxy or browser keeps it.
#  - Hashed build assets under /_nuxt/: cached for a year, immutable.
#  - Unknown asset paths 404 instead of falling back to index.html (an HTML body served as JS
#    would poison the SW precache).
# Note: nginx does not inherit add_header into a location that sets its own, so every location
# includes the same security headers.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    etag on;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location = /ping.txt {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /_nuxt/ {
        # No "always": the long cache must only apply to 2xx/3xx, never to a 404 during a deploy.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # Pages fall back to index.html; requests that look like files (have an extension) do not.
        try_files $uri $uri/ $uri.html @spa;
    }

    location @spa {
        if ($uri ~ \.[a-zA-Z0-9]+$) { return 404; }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        rewrite ^ /index.html break;
    }
}
