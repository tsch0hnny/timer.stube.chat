# Candidate builds at https://test-timer.stube.chat. Replaces the spike container (same project/service).
# On the VPS, from the repo clone:
#   cd /opt/timer/src && git fetch --tags && git checkout <commit-or-tag>
#   export APP_VERSION=$(git describe --tags --always --dirty)
#   docker compose -f deploy/compose.test.yml up -d --build
name: timer-test

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:?set APP_VERSION, e.g. export APP_VERSION=$(git describe --tags --always --dirty)}
    # Tagged with the version so deploy/compose.prod.yml can run this exact image.
    image: timer-stube-chat:${APP_VERSION:?set APP_VERSION}
    restart: unless-stopped
    networks: [traefik_net]
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_net
      traefik.http.routers.timer-test.rule: Host(`test-timer.stube.chat`)
      traefik.http.routers.timer-test.entrypoints: websecure
      traefik.http.routers.timer-test.tls.certresolver: letsencrypt
      traefik.http.services.timer-test.loadbalancer.server.port: "80"

networks:
  traefik_net:
    external: true
